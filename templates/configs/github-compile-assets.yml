# Builds and commits `assets/entry-*` on the default branch. The steps live in
# @plentiful/theme-standards and are shared by every client repo; this file only says
# when to run them. Keep it identical across repos apart from the default branch.
name: Compile Assets

on:
  push:
    branches: [main] # the repo's default branch (some repos use master)

permissions:
  contents: read

jobs:
  compile:
    uses: Plentiful-Commerce/theme-standards/.github/workflows/compile-assets.yml@main
    # The deploy key lives in this repo's compile-assets environment. Pass it by name:
    # a reusable workflow gets an empty string for any secret the caller doesn't pass.
    secrets:
      COMPILE_ASSETS_DEPLOY_KEY: ${{ secrets.COMPILE_ASSETS_DEPLOY_KEY }}
