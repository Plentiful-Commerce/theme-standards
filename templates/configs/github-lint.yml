# PC code-quality gate. The steps live in @plentiful/theme-standards and are shared
# by every client repo; this file only says when to run them. Keep it identical
# across repos apart from the default branch and the declared inputs.
name: Lint

on:
  pull_request:
  push:
    branches: [main] # the repo's default branch (some repos use master)

jobs:
  lint:
    uses: Plentiful-Commerce/theme-standards/.github/workflows/lint.yml@main
    # Both default to true. Set one to false only while that debt has a ticket.
    # with:
    #   stylelint: false
    #   prettier: false
