# Blocking: the PR description must follow the org PR template. The steps live in
# @plentiful/theme-standards and are shared by every client repo; this file only says
# when to run them. Keep it identical across repos.
name: PR description

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  pr-body:
    uses: Plentiful-Commerce/theme-standards/.github/workflows/pr-body.yml@main
