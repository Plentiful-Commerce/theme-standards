# Runs this package's own tests on every PR and on main, so a broken export path,
# a loose dependency pin or a rule regression fails before a release is tagged.
# The tests use Node built-ins only, so no npm ci.
name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: npm test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
