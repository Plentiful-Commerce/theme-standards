# Blocking: the PR description must follow the org PR template in
# Plentiful-Commerce/.github. Shared by every client theme repo: a repo's
# `.github/workflows/pr-body.yml` is a short caller (templates/configs/github-pr-body.yml)
# that references this file at `main`. It is its own workflow so that editing the
# description reruns only this check, not the whole lint gate.
#
# The check runs from the theme-standards version the repo pins, so a rule change
# reaches a repo with its next bump, like the other rules.
name: PR description

on:
  workflow_call:

permissions:
  contents: read

jobs:
  pr-body:
    name: PR description follows the org template
    runs-on: ubuntu-latest
    steps:
      # Dependabot can't fill in the org template. Its PRs still need Jocelyn's
      # approval, so the check passes for them instead of blocking every one.
      - name: Skip for Dependabot
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        run: echo "Opened by Dependabot; the PR description check doesn't apply."
      # Only package.json, to read the pinned theme-standards version. No install.
      - if: github.event.pull_request.user.login != 'dependabot[bot]'
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: package.json
          sparse-checkout-cone-mode: false
      - if: github.event.pull_request.user.login != 'dependabot[bot]'
        uses: actions/setup-node@v7
        with:
          node-version: 26
          package-manager-cache: false
      - name: Check the description
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        run: |
          spec=$(node -p 'const p = require("./package.json"); (p.devDependencies || {})["@plentiful/theme-standards"] || (p.dependencies || {})["@plentiful/theme-standards"] || ""')
          if [ -z "$spec" ]; then
            echo "package.json does not list @plentiful/theme-standards"
            exit 1
          fi
          npx --yes --package="$spec" pc-pr-body-check
